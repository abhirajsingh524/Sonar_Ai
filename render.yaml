services:
  - type: web
    name: sonar-ai-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
    envVars:
      - key: HF_API_KEY
        sync: false          # set manually in Render dashboard
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
      - key: FLASK_DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: HF_TIMEOUT
        value: "90"
      - key: HF_MAX_RETRIES
        value: "3"
    healthCheckPath: /health
    autoDeploy: true
